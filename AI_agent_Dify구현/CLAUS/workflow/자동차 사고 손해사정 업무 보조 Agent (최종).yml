        code: "import re\n\ndef main(\n    precedents=None,\n    web_results=None,\n\
          \    accident_summary=\"\",\n    damage_type=None,\n    injury_diagnosis=\"\
          \",\n    treatment_info=\"\",\n    vehicle_damage=\"\",\n    possible_issues=None,\n\
          \    claimed_amount=0,\n    **kwargs\n):\n    precedents = precedents or\
          \ []\n    web_results = web_results or []\n\n    def to_list(value):\n \
          \       if value is None:\n            return []\n        if isinstance(value,\
          \ list):\n            return [str(v).strip() for v in value if str(v).strip()]\n\
          \        if isinstance(value, str):\n            return [v.strip() for v\
          \ in re.split(r\"[,/\\n]\", value) if v.strip()]\n        return [str(value).strip()]\n\
          \n    def item_to_text(item):\n        if isinstance(item, dict):\n    \
          \        content = (\n                item.get(\"content\")\n          \
          \      or item.get(\"text\")\n                or item.get(\"snippet\")\n\
          \                or item.get(\"description\")\n                or \"\"\n\
          \            )\n            title = item.get(\"title\") or item.get(\"name\"\
          ) or \"\"\n            metadata = item.get(\"metadata\") or {}\n       \
          \     if isinstance(metadata, dict):\n                meta_text = \" \"\
          .join([str(v) for v in metadata.values()])\n            else:\n        \
          \        meta_text = str(metadata)\n            return f\"{title}\\n{content}\\\
          n{meta_text}\".strip()\n        return str(item)\n\n    def get_title(item,\
          \ idx, source_name):\n        if isinstance(item, dict):\n            title\
          \ = item.get(\"title\") or item.get(\"name\")\n            metadata = item.get(\"\
          metadata\") or {}\n            if not title and isinstance(metadata, dict):\n\
          \                title = metadata.get(\"document_name\") or metadata.get(\"\
          source\") or metadata.get(\"title\")\n            return title or f\"{source_name}\
          \ {idx}\"\n        return f\"{source_name} {idx}\"\n\n    damage_list =\
          \ to_list(damage_type)\n    issue_list = to_list(possible_issues)\n\n  \
          \  base_text = \" \".join([\n        str(accident_summary),\n        \"\
          \ \".join(damage_list),\n        str(injury_diagnosis),\n        str(treatment_info),\n\
          \        str(vehicle_damage),\n        \" \".join(issue_list)\n    ])\n\n\
          \    accident_keywords = [\n        \"후방추돌\", \"추돌\", \"측면충돌\", \"교차로\"\
