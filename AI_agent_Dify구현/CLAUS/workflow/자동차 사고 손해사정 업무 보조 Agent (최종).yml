            | 항목 | 확인이 필요한 이유 |

            |---|---|

            | (표준약관과 보험사 약관이 다를 수 있는 항목) | |

            | (검색으로 확인되지 않아 원문 확인이 필요한 항목) | |


            ---

            AI 약관 정리 초안. 최종 판단은 손해사정사가 함.

