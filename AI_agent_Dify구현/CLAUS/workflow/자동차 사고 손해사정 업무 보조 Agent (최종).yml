    - data:
        code: "def main(auto_knowledge=None, precedents=None,\n         std25_clauses=None,\
          \ std23_clauses=None, contract_year=\"\",\n         samsung_clauses=None,\
          \ hyundai_clauses=None, kb_clauses=None,\n         web_results=None, insurer=\"\
          \"):\n    def to_items(v):\n        if v is None: return []\n        if\
          \ isinstance(v, list): return v\n        return [v]\n    out=[]\n    # 1.\
          \ 자동차 사고 업무지식\n    out.append(\"=== [자동차 사고 업무지식] ===\")\n    ak=to_items(auto_knowledge)\n\
          \    if ak:\n        for i,item in enumerate(ak[:5],1):\n            content=item.get(\"\
          content\",\"\") if isinstance(item,dict) else str(item)\n            title=item.get(\"\
          title\",\"업무지식\"+str(i)) if isinstance(item,dict) else \"업무지식\"+str(i)\n\
          \            out.append(\"\\n[\"+str(i)+\"] \"+str(title)+\"\\n\"+content.strip())\n\
          \    else: out.append(\"검색 결과 없음\")\n    # 2. 판례·분쟁사례\n    out.append(\"\
          \\n\\n=== [관련 판례·분쟁사례] ===\")\n    pc=to_items(precedents)\n    if pc:\n\
          \        for i,item in enumerate(pc[:5],1):\n            content=item.get(\"\
          content\",\"\") if isinstance(item,dict) else str(item)\n            title=item.get(\"\
          title\",\"판례\"+str(i)) if isinstance(item,dict) else \"판례\"+str(i)\n   \
          \         out.append(\"\\n[판례 \"+str(i)+\"] \"+str(title)+\"\\n\"+content.strip())\n\
          \    else: out.append(\"검색 결과 없음\")\n    # 3. 표준약관 (계약연도 기준)\n    year_str=str(contract_year\
          \ or \"\")\n    if \"2025\" in year_str:\n        std_data=to_items(std25_clauses);\
          \ std_label=\"표준약관 (2025년 기준)\"\n    else:\n        std_data=to_items(std23_clauses);\
          \ std_label=\"표준약관 (2023년 기준)\"\n    out.append(\"\\n\\n=== [\"+std_label+\"\
          ] ===\")\n    if std_data:\n        for i,item in enumerate(std_data[:4],1):\n\
          \            content=item.get(\"content\",\"\") if isinstance(item,dict)\
          \ else str(item)\n            out.append(\"\\n[\"+std_label+\" \"+str(i)+\"\
          ]\\n\"+content.strip())\n    else: out.append(\"검색 결과 없음\")\n    # 4. 보험사별\
          \ 약관\n    insurer_str=str(insurer or \"\").strip()\n    insurer_map={\"\
          삼성화재\":(\"삼성화재\",samsung_clauses),\n                 \"현대해상\":(\"현대해상\"\
          ,hyundai_clauses),\n                 \"KB손해보험\":(\"KB손해보험\",kb_clauses)}\n\
          \    matched=None\n    for key,(label,data) in insurer_map.items():\n  \
          \      if key in insurer_str: matched=(label,data); break\n    if matched:\n\
          \        label,data=matched\n        out.append(\"\\n\\n=== [\"+label+\"\
          \ 약관] ===\")\n        cl=to_items(data)\n        if cl:\n            for\
          \ i,item in enumerate(cl[:3],1):\n                content=item.get(\"content\"\
          ,\"\") if isinstance(item,dict) else str(item)\n                out.append(\"\
          \\n[\"+label+\" 약관 \"+str(i)+\"]\\n\"+content.strip())\n        else: out.append(label+\"\
          \ 약관에서 관련 조항이 검색되지 않음\")\n    else:\n        out.append(\"\\n\\n=== [보험사별\
          \ 약관] ===\")\n        out.append(\"선택된 보험사 약관 없음 — 표준약관 기준으로만 검토\")\n  \
          \  # 5. 최신 웹 정보\n    out.append(\"\\n\\n=== [최신 판례·웹 정보] ===\")\n    wr=to_items(web_results)\n\
          \    if wr:\n        for i,item in enumerate(wr[:3],1):\n            if\
          \ isinstance(item,dict):\n                title=item.get(\"title\",\"\"\
          ); content=item.get(\"content\",\"\") or item.get(\"snippet\",\"\")\n  \
          \              url=item.get(\"url\",\"\")\n                out.append(\"\
          \\n[웹\"+str(i)+\"] \"+str(title)+\"\\n\"+str(content).strip()+\"\\n출처: \"\
          +str(url))\n            else: out.append(\"\\n[웹\"+str(i)+\"] \"+str(item))\n\
          \    else: out.append(\"검색 결과 없음\")\n    return {\"merged_context\": \"\\\
          n\".join(out)}\n"
