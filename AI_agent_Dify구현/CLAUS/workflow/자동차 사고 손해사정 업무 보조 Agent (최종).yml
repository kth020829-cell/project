app:
  description: 자동차 사고 전용 손해사정 검토 보조 Agent. 판례/약관/웹 검색, 소멸시효, 우선순위, 카카오 지도, Word 보고서
    저장 통합.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 자동차 사고 손해사정 업무 보조 Agent (분기 추가본)
  use_icon_as_answer_icon: false
