          \ = [\n        \"대인\", \"대물\", \"자차\", \"치료비\", \"수리비\", \"휴업손해\",\n   \
          \     \"위자료\", \"렌트비\", \"자동차상해\", \"자기신체사고\", \"자기차량손해\"\n    ]\n\n   \
          \ diagnosis_keywords = [\n        \"경추\", \"요추\", \"염좌\", \"타박상\", \"골절\"\
          , \"디스크\",\n        \"두통\", \"어지러움\", \"후유장해\", \"상해\"\n    ]\n\n    treatment_keywords\
          \ = [\n        \"통원\", \"입원\", \"물리치료\", \"MRI\", \"X-ray\", \"CT\", \"\
          약 처방\",\n        \"도수치료\", \"주사치료\"\n    ]\n\n    vehicle_keywords = [\n\
          \        \"범퍼\", \"전면\", \"후면\", \"문짝\", \"휀더\", \"사이드미러\",\n        \"\
          전손\", \"파손\", \"수리\", \"견적\", \"정비\"\n    ]\n\n    issue_keywords = [\n\
          \        \"인과관계\", \"기왕증\", \"기존 질환\", \"치료기간\", \"치료 적정성\",\n        \"\
          수리비 과다\", \"과실\", \"면책\", \"손해액\", \"후유장해\"\n    ]\n\n    def matched_keywords(source_text,\
          \ keyword_list):\n        return [kw for kw in keyword_list if kw in base_text\
          \ and kw in source_text]\n\n    candidates = []\n\n    all_items = []\n\
          \    for i, item in enumerate(precedents[:8], 1):\n        all_items.append((\"\
