          \    possible_issues=None,\n    submitted_documents=None,\n    submitted_doc=None,\n\
          \    coverage_candidates=None,\n    coverage_canc=None,\n    damage_type=None,\n\
          \    claimant_role=\"\",\n    claimed_amount=0,\n    claimed_amou=None,\n\
          \    **kwargs\n):\n\n # Dify 입력 변수명이 다르게 들어오는 경우까지 대비\n    missing_information\
          \ = missing_information or missing_inform or kwargs.get(\"missing_info\"\
          ) or kwargs.get(\"missing\")\n    possible_issues = possible_issues or kwargs.get(\"\
          possible_issue\") or kwargs.get(\"issues\")\n    submitted_documents = submitted_documents\
          \ or submitted_doc or kwargs.get(\"submitted_docs\") or kwargs.get(\"submitted_document\"\
          )\n    coverage_candidates = coverage_candidates or coverage_canc or kwargs.get(\"\
          coverage_candidate\") or kwargs.get(\"coverage\")\n    claimed_amount =\
          \ claimed_amount or claimed_amou or kwargs.get(\"claimed_am\") or kwargs.get(\"\
          amount\") or 0\n\n    def to_list(value): # 리스트로 변환하는 함수\n        if value\
          \ is None:\n            return []\n        if isinstance(value, list):\n\
          \            return [str(v).strip() for v in value if str(v).strip()]\n\
          \        if isinstance(value, str):\n            if not value.strip():\n\
          \                return []\n            parts = value.replace(\"\\n\", \"\
          ,\").split(\",\")\n            return [p.strip() for p in parts if p.strip()]\n\
          \        return [str(value).strip()]\n# 입력값 정리\n    missing_list = to_list(missing_information)\n\
          \    issue_list = to_list(possible_issues)\n    doc_list = to_list(submitted_documents)\n\
          \    coverage_list = to_list(coverage_candidates)\n    damage_list = to_list(damage_type)\n\
          \n# 검색용 텍스트 만들기\n    doc_text = \" \".join(doc_list)\n    issue_text = \"\
          \ \".join(issue_list)\n    damage_text = \" \".join(damage_list)\n    coverage_text\
          \ = \" \".join(coverage_list)\n\n    try:\n        amount = int(claimed_amount\
          \ or 0)\n    except:\n        amount = 0\n\n# 기본 변수 세팅\n    risk_score =\
          \ 0\n    reasons = []\n    missing_docs_list = []\n    review_focus_list\
          \ = []\n\n# 부족한 정보가 많을수록 점수를 올린다.\n    # 1. 부족 정보 기준\n    if len(missing_list)\
          \ >= 5:\n        risk_score += 25\n        reasons.append(\"추가 확인이 필요한 정보가\
          \ 많습니다.\")\n    elif len(missing_list) >= 3:\n        risk_score += 18\n\
          \        reasons.append(\"추가 확인이 필요한 정보가 일부 있습니다.\")\n    elif len(missing_list)\
          \ >= 1:\n        risk_score += 10\n        reasons.append(\"일부 정보 확인이 필요합니다.\"\
          )\n\n# 쟁점이 많을수록 점수를 올린다.\n# EX) 인과관계 불명확 / 치료 적정성 / 수리비 과다\n    # 2. 심사\
          \ 쟁점 기준\n    if len(issue_list) >= 5:\n        risk_score += 30\n      \
          \  reasons.append(\"자동차 사고 손해사정 쟁점이 많습니다.\")\n    elif len(issue_list) >=\
          \ 3:\n        risk_score += 22\n        reasons.append(\"주요 손해사정 쟁점이 일부\
          \ 확인됩니다.\")\n    elif len(issue_list) >= 1:\n        risk_score += 12\n\
          \        reasons.append(\"검토해야 할 쟁점이 있습니다.\")\n\n# 아래 키워드 중 하나라도 있으면 대인\
          \ 피해\n# 대인 피해가 있으면 단순 차량보다 검토가 많다.\n# 대인 피해 관련 부족 서류(진단서, 영수증 등) 확인\n  \
