          max_length: 20
          options: []
          placeholder: YYYY-MM-DD
          required: true
          type: text-input
          variable: accident_date
        - allowed_file_types: []
          hint: '아래 내용을 포함해서 자세히 서술해 주세요.

            ① 사고 경위: 언제, 어디서, 어떻게 발생했는지 (예: 신호 대기 중 후방 추돌)

            ② 청구인 지위: 피해자/가해자/동승자 등

            ③ 손해 유형: 대인(부상)/대물(차량파손)/자차 등

            ④ 상해·진단 내용: 진단명, 상해 등급, 치료 내용

            ⑤ 차량 파손: 파손 부위, 수리 현황

            ⑥ 쟁점: 보험사와 다투고 있는 부분 (예: 시세하락 거절, 대차료 일부 인정 등)'
          label: 사고 내용
          max_length: 4000
          options: []
          placeholder: 사고 경위, 부상 내용, 차량 파손, 보험사 쟁점 등을 자세히 서술하세요.
          required: true
          type: paragraph
          variable: accident_description
        - allowed_file_types: []
          hint: 예) 3800000
          label: 청구 금액 (원)
          max_length: 20
          options: []
          placeholder: ''
          required: false
          type: number
          variable: claimed_amount
        - allowed_file_types:
