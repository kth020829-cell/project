          \ }\nhr { border: none; border-top: 1px solid #ccc; margin: 16px 0; }\n\
          .doc-header { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom:\
          \ 20px; }\n.doc-title  { font-size: 17pt; font-weight: bold; text-align:\
          \ center;\n              color: #1a2a4a; margin-bottom: 4px; }\n.doc-meta\
          \   { text-align: right; color: #888; font-size: 9pt; }\n.summary-box {\
          \ margin: 8px 0 18px; padding: 11px 15px;\n               background: #f9f9f9;\
          \ border: 1px solid #ddd; line-height: 2.1; }\n.s-lbl { font-weight: bold;\
          \ color: #333; }\n.item-list  { margin: 8px 0 20px; }\n.item-block { border:\
          \ 1px solid #ddd; margin-bottom: 12px; page-break-inside: avoid; }\n.item-no\
          \    { background: #f2f2f2; color: #888; font-weight: bold;\n          \
          \    font-size: 9.5pt; padding: 4px 10px; }\n.item-row   { display: table;\
          \ width: 100%; border-top: 1px solid #eee; }\n.item-label { display: table-cell;\
          \ width: 24%; background: #f4f4f4;\n              font-weight: bold; color:\
          \ #333; padding: 5px 9px; font-size: 9.5pt;\n              border-right:\
          \ 1px solid #ddd; vertical-align: top; white-space: nowrap; }\n.item-val\
          \   { display: table-cell; padding: 5px 9px; font-size: 10pt; vertical-align:\
          \ top; }\ntable { table-layout: fixed; width: 100%; border-collapse: collapse;\n\
          \        margin: 10px 0 20px; page-break-inside: avoid; }\nth { border:\
          \ 1px solid #bbb; padding: 6px 8px; background: #f0f3f6;\n     text-align:\
          \ left; font-weight: bold; font-size: 10pt;\n     word-wrap: break-word;\
          \ white-space: normal; }\ntd { border: 1px solid #bbb; padding: 6px 8px;\
          \ vertical-align: top;\n     font-size: 10pt; word-wrap: break-word; white-space:\
          \ normal; }\n.footer-note { text-align: center; font-style: italic; color:\
          \ #999;\n               font-size: 8.5pt; margin-top: 36px; padding-top:\
          \ 12px;\n               border-top: 1px solid #ddd; }\n\"\"\"\n\n      \
          \  TMPL = \"\"\"<!DOCTYPE html>\n<html xmlns:o=\"urn:schemas-microsoft-com:office:office\"\
          \n      xmlns:w=\"urn:schemas-microsoft-com:office:word\"\n      xmlns=\"\
          http://www.w3.org/TR/REC-html40\">\n<head><meta charset=\"UTF-8\"><title>__TITLE__</title>\n\
          <style>__CSS__</style></head>\n<body>\n<div class=\"doc-header\">\n  <div\
          \ class=\"doc-title\">__TITLE__</div>\n  <div class=\"doc-meta\">생성일시: __TODAY__&nbsp;|&nbsp;보험\
          \ 유형: __ITYPE__</div>\n</div>\n__BODY__\n<div class=\"footer-note\">본 보고서는\
          \ AI가 정리한 자료 초안이며, 모든 판단과 결정은 손해사정사의 검토를 거쳐야 합니다.</div>\n</body></html>\"\
          \"\"\n\n        html_doc = (TMPL\n            .replace(\"__CSS__\",   CSS)\n\
          \            .replace(\"__TITLE__\", report_title)\n            .replace(\"\
          __TODAY__\", today)\n            .replace(\"__ITYPE__\", insurance_type)\n\
          \            .replace(\"__BODY__\",  html_body))\n\n        file_bytes =\
          \ html_doc.encode(\"utf-8\")\n        ts = datetime.now().strftime(\"%Y%m%d_%H%M%S\"\
          )\n        filename = \"손해사정의견서_\" + insurance_type + \"_\" + accident_date\
          \ + \"_\" + ts + \".doc\"\n        dropbox_path = \"/\" + filename\n\n \
          \       up_hdrs = {\n            \"Authorization\": \"Bearer \" + dropbox_token,\n\
          \            \"Content-Type\": \"application/octet-stream\",\n         \
          \   \"Dropbox-API-Arg\": json.dumps({\"path\": dropbox_path, \"mode\": \"\
          add\",\n                                           \"autorename\": True,\
          \ \"mute\": False})\n        }\n        req = urllib.request.Request(\n\
          \            \"https://content.dropboxapi.com/2/files/upload\",\n      \
          \      data=file_bytes, headers=up_hdrs, method=\"POST\")\n        with\
          \ urllib.request.urlopen(req, timeout=timeout_sec, context=ssl_ctx) as r:\n\
          \            actual_path = json.loads(r.read().decode()).get(\"path_display\"\
          , dropbox_path)\n\n        sh_hdrs = {\"Authorization\": \"Bearer \" + dropbox_token,\n\
          \                   \"Content-Type\": \"application/json\"}\n        raw_url\
          \ = \"\"\n        try:\n            req2 = urllib.request.Request(\n   \
          \             \"https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings\"\
          ,\n                data=json.dumps({\"path\": actual_path}).encode(), headers=sh_hdrs,\
          \ method=\"POST\")\n            with urllib.request.urlopen(req2, timeout=timeout_sec,\
          \ context=ssl_ctx) as r:\n                raw_url = json.loads(r.read().decode()).get(\"\
          url\", \"\")\n        except urllib.error.HTTPError as e:\n            if\
          \ e.code == 409:\n                req3 = urllib.request.Request(\n     \
          \               \"https://api.dropboxapi.com/2/sharing/list_shared_links\"\
          ,\n                    data=json.dumps({\"path\": actual_path}).encode(),\
          \ headers=sh_hdrs, method=\"POST\")\n                with urllib.request.urlopen(req3,\
          \ timeout=timeout_sec, context=ssl_ctx) as r:\n                    links\
          \ = json.loads(r.read().decode()).get(\"links\", [])\n                 \
          \   raw_url = links[0].get(\"url\", \"\") if links else \"\"\n         \
          \   else:\n                return {\"status\": \"failed\", \"filename\"\
          : filename, \"download_url\": \"\",\n                        \"message\"\
          : \"공유 링크 생성 실패: HTTP \" + str(e.code)}\n\n        if not raw_url:\n   \
          \         return {\"status\": \"failed\", \"filename\": filename, \"download_url\"\
          : \"\",\n                    \"message\": \"공유 링크를 가져오지 못했습니다.\"}\n\n  \
          \      import re as _re\n        url = _re.sub(r\"[?&]dl=\\d\", \"\", raw_url)\n\
          \        url = url.replace(\"www.dropbox.com\", \"dl.dropboxusercontent.com\"\
          )\n        if \"raw=1\" not in url:\n            url += (\"&\" if \"?\"\
          \ in url else \"?\") + \"raw=1\"\n\n        return {\"status\": \"success\"\
          , \"filename\": filename, \"download_url\": url,\n                \"message\"\
          : \"의견서 생성 완료. 미리보기: \" + url}\n\n    except Exception as e:\n        return\
          \ {\"status\": \"failed\", \"filename\": \"\", \"download_url\": \"\",\n\
          \                \"message\": \"오류 발생: \" + str(e)}\n\n\n# ─────────────────────────────────────────────────────────────────────────────\n\
          # 마크다운 → HTML\n#\n# 소주제(빨간 볼드 h2) 결정 우선순위:\n#   1) LLM이 **소주제** / ## 소주제\
          \ 를 출력했으면 그대로 사용\n#   2) 표 앞에 소주제가 없으면 → \"표 헤더 첫 칸\"으로 소주제 자동 판별\n#   \
          \   (LLM이 소주제를 빼먹어도 헤더만 보면 어느 섹션인지 알 수 있어 순서 밀림 없음)\n#\n# HEADER_TO_TITLE:\
          \ 헤더 첫 칸 키워드 → 소주제\n# ─────────────────────────────────────────────────────────────────────────────\n\
          def md_to_html(text: str, kind: str = \"etc\") -> str:\n    import re as\
          \ _re\n    lines = text.split(\"\\n\")\n    out = []\n    in_ul = in_ol\
          \ = False\n    last_block = \"\"\n    summary_done = False\n    h1_done\
          \ = False\n\n    # 표 헤더 첫 칸 키워드 → 소주제 (순서 무관, 헤더로 직접 판별)\n    HEADER_TITLE\
          \ = [\n        (\"핵심 쟁점\", \"손해사정 핵심 쟁점\"),\n        (\"쟁점\",      \"손해사정\
          \ 핵심 쟁점\"),\n        (\"우선순위\",  \"준비해야 할 서류\"),\n        (\"서류\",     \
          \ \"준비해야 할 서류\"),\n        (\"담보\",      \"담보별 확인 포인트\"),\n        (\"약관\
          \ 조항\", \"관련 약관 조항\"),\n        (\"판례\",      \"관련 판례·분쟁사례\"),\n       \
          \ (\"유사도\",    \"관련 판례·분쟁사례\"),\n    ]\n\n    def title_from_header(header):\n\
