            작성 규칙:

            - 검색된 약관에 실제로 있는 내용만 인용. 없는 조항 추론·생성 금지.

            - 각 조항: 출처 명시 + 본 사건과의 관련성 1문장. 충족/불충족 단정 금지.

            - 보험금 지급 여부·과실비율·면책 확정 금지.

            - 문체: 서두·어미·수식어 제거. "~임", "~해야 함", "~필요" 수준으로 간결하게.

            - 반드시 표 형식으로 출력. 나열 형식 사용 금지.


            [사건 정보]

            사고: {{#1780121110148.accident_date#}} / {{#1780121110148.accident_summary#}}

            손해 유형: {{#1780121110148.damage_type#}}

            담보 후보: {{#1780121110148.coverage_candidates#}}

            쟁점: {{#1780121110148.possible_issues#}}

            소멸시효: {{#1780039072568.status#}} / {{#1780039072568.message#}}


            [검색된 약관 자료]

            {{#1779897116545.merged_context#}}


            # 약관 조항 정리


            **사건 요약**

            | 항목 | 내용 |

            |---|---|

            | 사고 개요 | (일자 + 사고유형 + 손해유형 1줄) |

            | 담보 후보 | (해당 담보 나열) |

            | 소멸시효 | (상태 + 남은 기간) |


            ---


            **관련 약관 조항**


            | 약관 조항 (출처) | 핵심 내용 | 본 사건과의 관련성 |

            |---|---|---|

            | (조항명, 출처: 표준약관/보험사명) | (핵심 문구만. 1~2줄) | (연결 이유 1문장) |


            ---


