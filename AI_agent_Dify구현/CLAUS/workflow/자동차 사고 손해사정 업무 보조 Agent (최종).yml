          \n        if issue_match:\n            score += 20\n            reasons.append(\"\
          쟁점 유사: \" + \", \".join(issue_match[:3]))\n\n        if score > 100:\n \
          \           score = 100\n\n        if score > 0:\n            candidates.append({\n\
          \                \"source\": source_name,\n                \"title\": get_title(item,\
