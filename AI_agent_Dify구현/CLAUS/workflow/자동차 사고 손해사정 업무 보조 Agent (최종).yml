          ]):\n        risk_score += 10\n        review_focus_list.append(\"차량 파손\
          \ 내용과 수리비 적정성 확인\")\n        if not any(doc in doc_text for doc in [\"수리\
          \ 견적서\", \"차량 수리 견적서\", \"정비 견적서\"]):\n            missing_docs_list.append(\"\
          차량 수리 견적서\")\n        if not any(doc in doc_text for doc in [\"사고 현장 사진\"\
          , \"차량 파손 사진\", \"사진\"]):\n            missing_docs_list.append(\"사고 현장\
          \ 또는 차량 파손 사진\")\n\n# 손해사정 범위 내 복잡 쟁점(인과관계/기왕증/치료기간 등) 키워드\n    # 6. 인과관계/기왕증/치료\
          \ 적정성 관련 키워드 (손해사정 범위)\n    high_issue_keywords = [\"인과관계\", \"기왕증\", \"\
          기존 질환\", \"치료기간\", \"치료 적정성\", \"손해액\", \"후유장해\"]\n    if any(keyword in\
          \ issue_text for keyword in high_issue_keywords):\n        risk_score +=\
          \ 15\n        review_focus_list.append(\"사고와 상해의 인과관계, 기왕증 여부, 치료 적정성 등\
          \ 손해사정 핵심 쟁점 확인\")\n\n    # 8. 청구금액 기준\n    if amount >= 3000000:\n    \
          \    risk_score += 15\n        reasons.append(\"청구금액이 커서 손해액 산정 근거 확인이 중요합니다.\"\
          )\n    elif amount >= 1000000:\n        risk_score += 8\n        reasons.append(\"\
          청구금액에 대한 증빙자료 확인이 필요합니다.\")\n\n    # 9. 담보 후보가 많을수록 검토 복잡도 증가\n    if len(coverage_list)\
          \ >= 3:\n        risk_score += 8\n        reasons.append(\"검토 가능한 담보가 여러\
          \ 개로 확인됩니다.\")\n\n    # 중복 제거\n    missing_docs_list = list(dict.fromkeys(missing_docs_list))\n\
          \    review_focus_list = list(dict.fromkeys(review_focus_list))\n    reasons\
          \ = list(dict.fromkeys(reasons))\n\n    # 점수 상한\n    if risk_score > 100:\n\
          \        risk_score = 100\n\n    # 우선순위 결정\n    if risk_score >= 70:\n \
          \       priority = \"높음\"\n    elif risk_score >= 40:\n        priority\
          \ = \"보통\"\n    else:\n        priority = \"낮음\"\n\n# 점수 산정 아예 X -> 기본값\
          \ 설정\n    if not reasons:\n        reasons.append(\"현재 입력 정보 기준으로 특별한 고위험\
          \ 쟁점은 확인되지 않았습니다.\")\n\n# 부족 서류 문자열 만들기\n    if not missing_docs_list:\n\
          \        missing_docs = \"추가로 부족한 기본 서류는 확인되지 않았습니다.\"\n    else:\n    \
          \    missing_docs = \"\\n\".join([f\"- {doc}\" for doc in missing_docs_list])\n\
          \n# 중점 검토사항 문자열 만들기\n    if not review_focus_list:\n        review_focus\
          \ = \"기본 사고 사실, 제출서류, 약관상 담보 적용 여부 확인\"\n    else:\n        review_focus\
          \ = \"\\n\".join([f\"- {item}\" for item in review_focus_list])\n\n# 산정\
          \ 사유 문자열 만들기\n    priority_reasons = \"\\n\".join([f\"- {reason}\" for reason\
          \ in reasons])\n    \n# 최종 반환\n    return {\n        \"risk_score\": risk_score,\n\
          \        \"priority\": priority,\n        \"priority_reasons\": priority_reasons,\n\
          \        \"missing_docs\": missing_docs,\n        \"review_focus\": review_focus\n\
          \    }"
