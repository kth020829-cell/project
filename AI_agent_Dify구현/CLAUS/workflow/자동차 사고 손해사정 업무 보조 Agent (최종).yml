          \       lines.append(\n            f\"| {idx} | {case['source']} - {title}\
          \ | {case['score']}점 | {reason_text} | {summary} |\"\n        )\n\n    lines.append(\"\
          \")\n    lines.append(\"> 유사도 점수는 판례 결론을 본 사건에 그대로 적용한다는 의미가 아니라, 손해사정 검토\
