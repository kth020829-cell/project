          \  \"reasons\": reasons,\n                \"summary\": text[:180].replace(\"\
          \\n\", \" \")\n            })\n\n    candidates = sorted(candidates, key=lambda\
          \ x: x[\"score\"], reverse=True)\n    top_cases = candidates[:5]\n\n   \
          \ if not top_cases:\n        report = \"관련 판례·분쟁사례와의 유사도 점수를 산정할 수 없습니다.\"\
          \n        return {\n            \"matched_cases_report\": report,\n    \
          \        \"top_similarity_score\": 0,\n            \"similarity_grade\"\
          : \"낮음\",\n            \"top_case_count\": 0\n        }\n\n    top_score\
          \ = top_cases[0][\"score\"]\n\n    if top_score >= 75:\n        grade =\
          \ \"높음\"\n    elif top_score >= 50:\n        grade = \"보통\"\n    else:\n\
          \        grade = \"낮음\"\n\n    lines = []\n    lines.append(\"## 유사사례 매칭\
