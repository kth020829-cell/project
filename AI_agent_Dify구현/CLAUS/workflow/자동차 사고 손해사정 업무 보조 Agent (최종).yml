          \ 수 없습니다.\"}\n\n    doc = docs[0]\n    lat = doc.get(\"y\", \"\")\n    lng\
          \ = doc.get(\"x\", \"\")\n    address = doc.get(\"address_name\", \"\")\n\
          \n    # 장소명을 URL 인코딩해서 공백/한글로 인한 링크 깨짐 방지\n    place = urllib.parse.quote(address)\n\
          \    # 카카오맵 link/map 포맷: 장소명,위도,경도\n    map_link = \"https://map.kakao.com/link/map/\"\
          \ + place + \",\" + str(lat) + \",\" + str(lng)\n\n    return {\"map_link\"\
          : map_link, \"address\": address}\n"
