          \  text = str(contract_year_text or \"\").strip()\n    # 4자리 연도 추출\n   \
          \ m = re.search(r\"(\\d{4})\", text)\n    if m:\n        year = int(m.group(1))\n\
          \    else:\n        year = 2025  # 기본값: 입력 없으면 최신 약관\n\n    # 2025 이상이면\
          \ 25년 약관, 미만이면 23년 약관\n    if year >= 2025:\n        policy_version = \"\
          2025\"\n    else:\n        policy_version = \"2023\"\n\n    return {\n \
          \       \"contract_year_int\": year,\n        \"policy_version\": policy_version\n\
          \    }\n"
