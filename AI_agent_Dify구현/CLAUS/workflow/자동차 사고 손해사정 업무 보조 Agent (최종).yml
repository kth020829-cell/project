          )\n    lines.append(f\"- 유사도 등급: {grade}\")\n    lines.append(\"\")\n  \
          \  lines.append(\"| 순위 | 출처 | 유사도 | 유사한 이유 | 사례 요약 |\")\n    lines.append(\"\
          |---|---|---:|---|---|\")\n\n    for idx, case in enumerate(top_cases, 1):\n\
          \        reason_text = \"<br>\".join(case[\"reasons\"]) if case[\"reasons\"\
