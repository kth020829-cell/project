    - data:
        code: "from datetime import datetime, date\n\ndef main(accident_date: str)\
          \ -> dict:\n    try:\n        accident = datetime.strptime(accident_date,\
          \ \"%Y-%m-%d\").date()\n        today = date.today()\n        \n       \
          \ # 사고일로부터 경과 일수\n        elapsed_days = (today - accident).days\n     \
          \   elapsed_years = elapsed_days / 365.25\n        \n        # 보험금 청구권 소멸시효:\
          \ 3년 (상법 제662조)\n        remaining_days = (3 * 365) - elapsed_days\n   \
          \     remaining_months = remaining_days / 30\n        \n        # 경고 메시지\
          \ 생성\n        if remaining_days < 0:\n            status = \"⚠️ 시효 경과\"\n\
          \            message = f\"사고일로부터 {elapsed_years:.1f}년 경과. 청구권 소멸시효(3년)가\
          \ 이미 지났습니다. 시효 중단 사유 확인이 필요합니다.\"\n        elif remaining_days < 180:\n\
          \            status = \"\U0001F534 시효 임박\"\n            message = f\"사고일로부터\
          \ {elapsed_years:.1f}년 경과. 소멸시효까지 약 {int(remaining_months)}개월 남음. 신속한 청구가\
          \ 필요합니다.\"\n        elif remaining_days < 365:\n            status = \"\U0001F7E1\
          \ 시효 주의\"\n            message = f\"사고일로부터 {elapsed_years:.1f}년 경과. 소멸시효까지\
          \ 약 {int(remaining_months)}개월 남음.\"\n        else:\n            status =\
          \ \"\U0001F7E2 시효 여유\"\n            message = f\"사고일로부터 {elapsed_years:.1f}년\
          \ 경과. 소멸시효까지 약 {int(remaining_months)}개월 남음.\"\n        \n        return\
          \ {\n            \"status\": status,\n            \"message\": message,\n\
          \            \"elapsed_days\": elapsed_days,\n            \"remaining_days\"\
          : remaining_days\n        }\n    except Exception as e:\n        return\
          \ {\n            \"status\": \"확인 불가\",\n            \"message\": f\"사고일자\
          \ 형식 오류로 시효 계산 불가: {accident_date}\",\n            \"elapsed_days\": 0,\n\
          \            \"remaining_days\": 0\n        }"
        code_language: python3
