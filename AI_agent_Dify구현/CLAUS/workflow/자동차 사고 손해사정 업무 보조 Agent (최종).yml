          \ or report_issue or \"\"\n\n        # 보조 정보를 맨 뒤에 배치\n        footer_lines\
          \ = []\n        footer_lines.append(\"\")\n        footer_lines.append(\"\
          ---\")\n        footer_lines.append(\"\")\n        footer_lines.append(\"\
          ### 보조 정보 (참고용)\")\n        footer_lines.append(\"\")\n        footer_lines.append(\"\
          | 항목 | 내용 |\")\n        footer_lines.append(\"| :--- | :--- |\")\n     \
          \   footer_lines.append(\"| 검토 우선순위 | \" + str(priority) + \" (위험점수 \" +\
          \ str(risk_score) + \"/100) |\")\n        footer_lines.append(\"| 소멸시효 상태\
          \ | \" + str(sosmyeol_status) + \" |\")\n        if sosmyeol_message:\n\
          \            footer_lines.append(\"| 소멸시효 안내 | \" + str(sosmyeol_message)\
          \ + \" |\")\n        if map_address and \"찾을 수 없\" not in str(map_address):\n\
          \            footer_lines.append(\"| 사고 위치 | \" + str(map_address) + \"\
          \ |\")\n        if map_link and \"찾을 수 없\" not in str(map_link):\n     \
          \       footer_lines.append(\"| 위치 지도 | [카카오맵에서 보기](\" + str(map_link) +\
          \ \") |\")\n        footer_lines.append(\"\")\n        footer_lines.append(\"\
          > 검토 우선순위는 '청구 가능성'이 아니라, 손해사정사가 얼마나 면밀히 확인해야 하는지를 나타내는 업무 보조 지표입니다.\")\n\
          \n        footer = \"\\n\".join(footer_lines)\n        final_result = (report_text\
          \ or \"\") + footer\n        return {\"result\": final_result}\n    except\
          \ Exception as e:\n        return {\"result\": (report_text or \"\") + \"\
          \\n\\n(보조 정보 생성 중 오류: \" + str(e) + \")\"}\n"
